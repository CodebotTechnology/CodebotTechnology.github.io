<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="CodeBot Technologies">
  <defs>
    <linearGradient id="cb-g" x1="12" y1="10" x2="108" y2="112" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7B5CFF"/><stop offset=".5" stop-color="#3D8BFF"/><stop offset="1" stop-color="#14D2B8"/></linearGradient>
    <linearGradient id="cb-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
    <linearGradient id="cb-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2456"/><stop offset="1" stop-color="#090C22"/></linearGradient>
    <filter id="cb-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    /* Eyes glance toward the spark now and then */
    .eyes { animation: look 7s ease-in-out infinite; }
    @keyframes look {
      0%, 38%, 62%, 100% { transform: translateX(0); }
      44%, 56% { transform: translateX(3.5px); }
    }
    /* Blink */
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s ease-in-out infinite; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(.12); }
    }
    /* Antenna light pulses */
    .light { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    /* Spark twinkles */
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.55); opacity: .55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eyes, .eye, .light, .spark { animation: none; }
    }
  </style>
  <path d="M88.2 40.6A38 38 0 1 0 88.2 91.4" fill="none" stroke="url(#cb-g)" stroke-width="18" stroke-linecap="round"/>
  <path d="M60 19V11" stroke="url(#cb-g)" stroke-width="5" stroke-linecap="round"/>
  <circle class="light" cx="60" cy="8" r="5.5" fill="url(#cb-a)" filter="url(#cb-glow)"/>
  <rect x="37" y="52" width="46" height="28" rx="14" fill="url(#cb-v)"/>
  <g class="eyes">
    <rect class="eye" x="47" y="59" width="8.5" height="14" rx="4.25" fill="#6FF5E4" filter="url(#cb-glow)"/>
    <rect class="eye" x="64.5" y="59" width="8.5" height="14" rx="4.25" fill="#6FF5E4" filter="url(#cb-glow)"/>
  </g>
  <circle class="spark" cx="101" cy="66" r="6" fill="url(#cb-a)" filter="url(#cb-glow)"/>
</svg>
